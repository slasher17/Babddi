<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Just for Babdiii ❤️</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif}body{min-height:100vh;background:radial-gradient(circle at top,#fff7fa,#ffdfe9 55%,#f6c4d4);display:grid;place-items:center;padding:22px;color:#65283e}.gatebox{width:min(520px,100%);background:#fffaf8;border:1px solid #ecc4d0;border-radius:32px;padding:42px 28px;text-align:center;box-shadow:0 30px 90px #65283e2b}.lock{font-size:48px}.gatebox h1{font-size:34px;font-weight:500;margin:14px 0 8px}.gatebox p{line-height:1.7;color:#805466}.question{font-style:italic;margin:20px 0}.answer{width:100%;padding:15px 18px;border:1px solid #dfb4c2;border-radius:16px;background:white;font-size:16px;outline:none;text-align:center}.answer:focus{box-shadow:0 0 0 3px #f1cbd7}.unlock{margin-top:14px;border:0;border-radius:999px;background:#65283e;color:white;padding:14px 25px;font-size:16px;cursor:pointer;width:100%}.unlock:active{transform:translateY(1px)}.error{min-height:22px;color:#a33f5e;font:13px Arial;margin-top:10px}.private-note{font:11px Arial;letter-spacing:.5px;color:#a87587;margin-top:18px}</style></head><body><main class="gatebox"><div class="lock">🔐💗</div><h1>Just for you, Babdiii</h1><p>This little corner of my heart is private. Before you come in, answer the question only <b>my Babdiii</b> would know. 🥹</p><div class="question">What does Babbduu call you? ❤️</div><form id="unlockForm" novalidate><input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Your answer…" aria-label="Your answer"><button class="unlock" type="submit">Unlock my heart 💌</button></form><div class="error" id="error" role="alert" aria-live="polite"></div><div class="private-note">A tiny secret between Babbduu &amp; Babdiii ✨</div></main><script>(function(){'use strict';const SECRET='babdiii';const form=document.getElementById('unlockForm'),answer=document.getElementById('answer'),error=document.getElementById('error');form.addEventListener('submit',function(e){e.preventDefault();const value=answer.value.trim().toLowerCase();if(value===SECRET){error.textContent='Opening your little world… ❤️';window.location.replace('love.html')}else{error.textContent='Hmm… that’s not quite it, my love. Try again ❤️';answer.focus();answer.select()}});answer.focus()})();</script></body></html>
